<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#ffffff">

  <title>BSN Manager</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          maxWidth: {
            mobile: "500px"
          }
        }
      }
    };
  </script>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-900">

  <!-- APP -->
  <div
    id="app"
    class="mx-auto flex h-full w-full max-w-[500px] flex-col bg-white shadow-sm"
  >

    <!-- HEADER -->
    <header class="shrink-0 border-b border-slate-200 bg-white px-4 py-3">
      <div class="flex items-center justify-between gap-3">

        <div class="min-w-0">
          <h1 class="truncate text-lg font-bold">
            BSN Manager
          </h1>

          <p
            id="user-count"
            class="text-xs text-slate-500"
          >
            0 users
          </p>
        </div>

        <button
          id="add-user-btn"
          type="button"
          class="shrink-0 rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white active:scale-95"
        >
          Add User
        </button>

      </div>
    </header>


    <!-- MAIN -->
    <main
      id="main-content"
      class="min-h-0 flex-1 overflow-y-auto p-4"
    >

      <!-- LOADING -->
      <div
        id="loading-state"
        class="hidden py-12 text-center"
      >
        <div class="mx-auto mb-3 h-7 w-7 animate-spin rounded-full border-2 border-slate-200 border-t-slate-900"></div>

        <p class="text-sm text-slate-500">
          Loading...
        </p>
      </div>


      <!-- ERROR -->
      <div
        id="error-state"
        class="hidden rounded-xl border border-red-200 bg-red-50 p-4"
      >

        <p
          id="error-message"
          class="text-sm text-red-700"
        ></p>

        <button
          id="retry-btn"
          type="button"
          class="mt-3 rounded-lg bg-red-700 px-3 py-2 text-xs font-semibold text-white"
        >
          Retry
        </button>

      </div>


      <!-- EMPTY -->
      <div
        id="empty-state"
        class="hidden py-12 text-center"
      >

        <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-slate-100">
          <span class="text-xl">—</span>
        </div>

        <p class="font-semibold">
          No users found
        </p>

        <p class="mt-1 text-sm text-slate-500">
          Create a user to get started.
        </p>

      </div>


      <!-- USER LIST -->
      <div
        id="user-list"
        class="space-y-3"
      ></div>

    </main>

  </div>


  <!-- MODAL -->
  <div
    id="modal"
    class="fixed inset-0 z-50 hidden"
  >

    <!-- BACKDROP -->
    <div
      id="modal-backdrop"
      class="absolute inset-0 bg-black/50"
    ></div>


    <!-- MODAL WRAPPER -->
    <div
      class="relative flex h-full items-end justify-center sm:items-center"
    >

      <!-- MODAL -->
      <section
        class="flex max-h-[92%] w-full max-w-[500px] flex-col overflow-hidden rounded-t-2xl bg-white sm:rounded-2xl"
      >

        <!-- MODAL HEADER -->
        <div
          class="flex shrink-0 items-center justify-between border-b border-slate-200 px-4 py-3"
        >

          <h2
            id="modal-title"
            class="text-base font-bold"
          >
            User
          </h2>

          <button
            id="close-modal-btn"
            type="button"
            class="rounded-lg p-2 text-2xl leading-none text-slate-500 hover:bg-slate-100"
            aria-label="Close"
          >
            &times;
          </button>

        </div>


        <!-- MODAL CONTENT -->
        <div
          id="modal-content"
          class="min-h-0 overflow-y-auto p-4"
        ></div>

      </section>

    </div>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] mx-auto hidden max-w-[460px] px-4"
  >

    <div
      id="toast-content"
      class="rounded-xl px-4 py-3 text-sm font-medium shadow-lg"
    ></div>

  </div>


  <!-- JAVASCRIPT -->
  <script
    src="./script.js"
    defer
  ></script>

</body>
</html>
