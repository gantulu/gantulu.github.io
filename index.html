<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="A lightweight React website served as static files." />
  <title>gantulu.github.io</title>
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/app.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
</head>
<body>
  <div id="root"><main class="loading" aria-live="polite">Loading application…</main></div>
  <!-- Babel Standalone compiles JSX directly in the browser. Keep dependency order. -->
  <script type="text/babel" data-presets="env,react" src="./components/Header.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="./components/Footer.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="./pages/Home.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="./pages/About.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="./pages/NotFound.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="./App.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<window.App />);
  </script>
</body>
</html>
