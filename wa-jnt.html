<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp CS Agent v2.0</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styling & WhatsApp theme variables -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #d1d5db;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile viewport frame mockup for desktop view */
        .mobile-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 932px;
            margin: 0 auto;
            position: relative;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 500px) {
            .mobile-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
        }

        /* Custom Scrollbar hides */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .chat-bg {
            background-color: #efeae2;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* Pulse animation for active indicators */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-online {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        /* Quick reply chips animation */
        .chip-slide {
            transition: all 0.2s ease;
        }
        .chip-slide:active {
            transform: scale(0.93);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="app" class="mobile-container md:rounded-3xl border border-gray-300/60">

        <!-- Toast Notification Container -->
        <div id="toast" class="hidden absolute top-16 left-4 right-4 z-50 p-3 rounded-xl shadow-xl text-xs font-medium flex items-center justify-between transition-all duration-300 transform -translate-y-4 opacity-0">
            <span id="toast-message">Notification</span>
            <button onclick="closeToast()" class="text-xs font-bold ml-2 hover:opacity-80">✕</button>
        </div>

        <!-- SCREEN 1: INBOX SCREEN -->
        <div id="screen-inbox" class="flex flex-col h-full w-full bg-[#f5f5f5]">
            <!-- Header Inbox -->
            <header class="bg-[#075E54] text-white p-4 pt-6 shadow-md flex-none z-10">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-base shadow border border-emerald-400">
                            💬
                        </div>
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <h1 class="text-lg font-bold tracking-tight leading-tight">WhatsApp CS Agent</h1>
                                <span class="bg-emerald-800 text-emerald-200 text-[9px] font-bold px-1.5 py-0.5 rounded">v2.0</span>
                            </div>
                            <p class="text-[11px] text-emerald-200">Live Customer Dashboard</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-1">
                        <button onclick="playNotificationSound()" title="Tes Suara Notifikasi" class="p-2 rounded-full hover:bg-emerald-700/50 active:scale-95 transition text-emerald-100">
                            🔔
                        </button>
                        <button onclick="loadInbox(true)" id="refresh-btn" title="Refresh Data" class="p-2 rounded-full hover:bg-emerald-700/50 active:scale-95 transition text-white">
                            <svg id="refresh-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="relative mt-3">
                    <input type="text" id="search-input" oninput="filterConversations()" placeholder="Cari nama, nomor HP, atau isi pesan..." 
                           class="w-full pl-9 pr-4 py-2 bg-white/10 text-white placeholder-emerald-100/70 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300 transition shadow-inner">
                    <svg class="w-4 h-4 text-emerald-100/70 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Category Filter Tabs -->
                <div class="flex space-x-2 mt-3 text-xs font-medium overflow-x-auto scrollbar-none pb-0.5">
                    <button onclick="setTabFilter('all')" id="tab-all" class="px-3 py-1 rounded-full bg-white text-emerald-900 font-bold transition shadow-sm">Semua</button>
                    <button onclick="setTabFilter('unread')" id="tab-unread" class="px-3 py-1 rounded-full bg-emerald-800/60 text-emerald-100 hover:bg-emerald-800 transition">Perlu Balas</button>
                    <button onclick="setTabFilter('replied')" id="tab-replied" class="px-3 py-1 rounded-full bg-emerald-800/60 text-emerald-100 hover:bg-emerald-800 transition">Terjawab</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-3 space-y-2 scrollbar-none" id="inbox-list-container">
                <!-- Dynamic Content Loaded via JS -->
            </main>

            <!-- Footer status bar -->
            <footer class="p-2.5 bg-white border-t border-gray-200 text-center text-[10px] text-gray-500 flex justify-between px-4 items-center flex-none">
                <span id="last-updated-text">Auto sync aktif (15s)</span>
                <span class="inline-flex items-center font-medium text-emerald-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 pulse-online"></span> System Online
                </span>
            </footer>
        </div>


        <div id="screen-chat" class="hidden flex flex-col h-full w-full bg-white absolute inset-0 z-20">
            <!-- Header Chat -->
            <header class="bg-[#075E54] text-white p-3 pt-4 shadow-md flex items-center justify-between flex-none z-10">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <!-- Back Button -->
                    <button onclick="closeChat()" class="p-1.5 rounded-full hover:bg-emerald-700/50 active:scale-95 transition text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>

                    <!-- Profile Info -->
                    <div class="flex items-center space-x-2.5 min-w-0 cursor-pointer" onclick="openCustomerNoteModal()">
                        <div id="chat-header-avatar" class="w-10 h-10 rounded-full bg-emerald-800 text-white font-bold flex items-center justify-center text-sm shadow-inner border border-emerald-400 flex-none">
                            C
                        </div>
                        <div class="leading-tight min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <h2 id="chat-header-name" class="font-bold text-sm tracking-wide text-white truncate">Nama Customer</h2>
                                <span id="chat-header-tag" class="hidden bg-yellow-400 text-gray-900 font-bold text-[9px] px-1.5 py-0.2 rounded-full flex-none">Tag</span>
                            </div>
                            <p id="chat-header-phone" class="text-[11px] text-emerald-200 tracking-wider font-mono">628xxxxxxxxxx</p>
                        </div>
                    </div>
                </div>

                <!-- Header Actions -->
                <div class="flex items-center space-x-1 flex-none">
                    <button onclick="copyCustomerPhone()" title="Salin Nomor HP" class="p-2 rounded-full hover:bg-emerald-700/50 active:scale-95 transition text-emerald-100">
                        📋
                    </button>
                    <button onclick="loadMessages(currentChat, true)" title="Refresh Chat" class="p-2 rounded-full hover:bg-emerald-700/50 active:scale-95 transition text-emerald-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Scrollable Body -->
            <main id="chat-messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 chat-bg">
                <!-- Chat bubbles rendered dynamically -->
            </main>

            <footer class="p-2.5 bg-gray-100 border-t border-gray-200 flex-none space-y-2">
                <!-- Quick Reply Bar -->
                <div class="flex space-x-1.5 overflow-x-auto scrollbar-none pt-0.5 pb-1">
                    <span class="text-[10px] text-gray-400 font-medium my-auto flex-none">Pesan Cepat:</span>
                    <button onclick="insertQuickReply('Halo Kak, ada yang bisa kami bantu? 😊')" class="chip-slide text-[11px] bg-white border border-gray-300 text-gray-700 px-2.5 py-1 rounded-full whitespace-nowrap shadow-xs hover:bg-emerald-50 hover:border-emerald-300">👋 Halo, ada bantuan?</button>
                    <button onclick="insertQuickReply('Mohon tunggu sebentar ya Kak, sedang kami cek... 🙏')" class="chip-slide text-[11px] bg-white border border-gray-300 text-gray-700 px-2.5 py-1 rounded-full whitespace-nowrap shadow-xs hover:bg-emerald-50 hover:border-emerald-300">⏳ Mohon tunggu</button>
                    <button onclick="insertQuickReply('Terima kasih telah menghubungi Customer Service kami! 🙏✨')" class="chip-slide text-[11px] bg-white border border-gray-300 text-gray-700 px-2.5 py-1 rounded-full whitespace-nowrap shadow-xs hover:bg-emerald-50 hover:border-emerald-300">✅ Terima kasih</button>
                </div>

                <!-- Composer Input Bar -->
                <form id="message-form" onsubmit="handleSendSubmit(event)" class="flex items-center space-x-2">
                    <input type="text" 
                           id="message-input" 
                           oninput="toggleSendButton()" 
                           placeholder="Ketik balasan pesan..." 
                           autocomplete="off"
                           class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-sm placeholder-gray-400">
                    
                    <button type="submit" 
                            id="send-btn" 
                            disabled 
                            class="bg-emerald-600 text-white p-2.5 rounded-full hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed transition shadow active:scale-95 flex items-center justify-center flex-none">
                        <svg class="w-5 h-5 transform rotate-90 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>

        <div id="note-modal" class="hidden absolute inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-gray-800">Label / Tag Customer</h3>
                    <button onclick="closeCustomerNoteModal()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
                </div>
                <p class="text-xs text-gray-500">Tambahkan tag khusus untuk memudahkan pengorganisasian pesan.</p>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Pilih Tag</label>
                    <select id="modal-tag-select" class="w-full border border-gray-300 rounded-xl p-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">Tanpa Tag</option>
                        <option value="VIP">⭐ VIP Customer</option>
                        <option value="Urgent">🚨 Urgent / Prioritas</option>
                        <option value="Pending">⏳ Pending Order</option>
                        <option value="Selesai">✅ Selesai</option>
                    </select>
                </div>
                <div class="flex space-x-2 pt-2">
                    <button onclick="closeCustomerNoteModal()" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold">Batal</button>
                    <button onclick="saveCustomerTag()" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-emerald-700">Simpan Tag</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const READ_API = "https://oszqantvugvbvydlizix.supabase.co/functions/v1/read-wa-jnt";
        const SEND_API = "https://oszqantvugvbvydlizix.supabase.co/functions/v1/send";

        // GLOBAL APPLICATION STATE
        let currentChat = null;        // Active chat_id
        let conversations = [];       // Grouped conversations
        let rawMessages = [];          // Raw JSON messages
        let messages = [];             // Active chat messages
        let autoRefreshTimer = null;   // Polling interval
        let filteredSearchQuery = "";  // Search term
        let currentTabFilter = "all";  // Filter: 'all' | 'unread' | 'replied'
        let customerTags = JSON.parse(localStorage.getItem('wa_cs_tags') || '{}'); // Tag store

        // DOM ELEMENTS
        const screenInbox = document.getElementById('screen-inbox');
        const screenChat = document.getElementById('screen-chat');
        const inboxContainer = document.getElementById('inbox-list-container');
        const chatContainer = document.getElementById('chat-messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');


        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (e) {
                console.log("Audio play blocked by browser context.");
            }
        }


        function formatTime(isoString) {
            if (!isoString) return '';
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return isoString;

                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();

                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                const timeStr = `${hours}:${minutes}`;

                if (isToday) {
                    return timeStr;
                } else {
                    const day = date.getDate().toString().padStart(2, '0');
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    return `${day}/${month} ${timeStr}`;
                }
            } catch (e) {
                return isoString;
            }
        }

        function getInitials(name) {
            if (!name) return 'C';
            const cleanName = name.trim();
            if (!cleanName) return 'C';
            const parts = cleanName.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return cleanName.substring(0, 2).toUpperCase();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.innerText = message;
            if (isError) {
                toast.className = "absolute top-16 left-4 right-4 z-50 p-3 rounded-xl shadow-xl text-xs font-medium flex items-center justify-between transition-all duration-300 bg-red-600 text-white transform translate-y-0 opacity-100";
            } else {
                toast.className = "absolute top-16 left-4 right-4 z-50 p-3 rounded-xl shadow-xl text-xs font-medium flex items-center justify-between transition-all duration-300 bg-emerald-800 text-white transform translate-y-0 opacity-100";
            }

            setTimeout(() => {
                closeToast();
            }, 3200);
        }

        function closeToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('-translate-y-4', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 300);
        }


        async function loadInbox(isManualRefresh = false) {
            if (isManualRefresh) {
                showRefreshSpinner(true);
            } else if (conversations.length === 0) {
                showLoadingInbox();
            }

            try {
                const response = await fetch(READ_API);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                rawMessages = Array.isArray(data) ? data : [];
                
                // Group raw array messages into grouped customer conversation list
                groupConversation(rawMessages);
                
                // Render Inbox UI
                renderInbox();

                // Update last sync time badge
                const now = new Date();
                document.getElementById('last-updated-text').innerText = `Sync: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            } catch (error) {
                console.error("Error fetching inbox:", error);
                if (conversations.length === 0) {
                    showErrorInbox("Gagal memuat percakapan. Periksa koneksi internet Anda.");
                } else {
                    showToast("Gagal menyinkronkan data", true);
                }
            } finally {
                showRefreshSpinner(false);
            }
        }

        function groupConversation(dataArray) {
            const groupedMap = new Map();

            dataArray.forEach(item => {
                const chatId = item.chat_id;
                if (!chatId) return;

                const itemTime = new Date(item.time || 0).getTime();

                if (!groupedMap.has(chatId)) {
                    groupedMap.set(chatId, {
                        chat_id: chatId,
                        first_name: item.first_name || 'Customer',
                        latest_message: item.user_message || '',
                        latest_time: item.time,
                        latest_timestamp: itemTime,
                        agent_name: item.agent_name,
                        raw_data: item
                    });
                } else {
                    const existing = groupedMap.get(chatId);
                    const existingTime = new Date(existing.latest_time || 0).getTime();

                    // Update if a newer message is found chronologically
                    if (itemTime > existingTime) {
                        existing.latest_message = item.user_message || '';
                        existing.latest_time = item.time;
                        existing.latest_timestamp = itemTime;
                        existing.agent_name = item.agent_name;
                        if (item.first_name) {
                            existing.first_name = item.first_name;
                        }
                    }
                }
            });

            // Convert map to array and sort descending by timestamp (newest on top)
            conversations = Array.from(groupedMap.values()).sort((a, b) => b.latest_timestamp - a.latest_timestamp);
        }


        function setTabFilter(filter) {
            currentTabFilter = filter;
            
            // Tab Buttons Styling
            ['all', 'unread', 'replied'].forEach(f => {
                const btn = document.getElementById(`tab-${f}`);
                if (f === filter) {
                    btn.className = "px-3 py-1 rounded-full bg-white text-emerald-900 font-bold transition shadow-sm";
                } else {
                    btn.className = "px-3 py-1 rounded-full bg-emerald-800/60 text-emerald-100 hover:bg-emerald-800 transition";
                }
            });

            renderInbox();
        }

        function renderInbox() {
            let displayList = conversations;

            // Apply Tab Category Filter
            if (currentTabFilter === 'unread') {
                // Unreplied customer messages (agent_name === null)
                displayList = displayList.filter(c => c.agent_name === null);
            } else if (currentTabFilter === 'replied') {
                // Agent replied messages (agent_name !== null)
                displayList = displayList.filter(c => c.agent_name !== null);
            }

            // Apply Search Filter if input is present
            if (filteredSearchQuery.trim() !== "") {
                const q = filteredSearchQuery.toLowerCase();
                displayList = displayList.filter(c => 
                    (c.first_name && c.first_name.toLowerCase().includes(q)) ||
                    (c.chat_id && c.chat_id.includes(q)) ||
                    (c.latest_message && c.latest_message.toLowerCase().includes(q))
                );
            }

            if (displayList.length === 0) {
                inboxContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center text-gray-400">
                        <div class="w-14 h-14 rounded-full bg-gray-200 flex items-center justify-center text-2xl mb-2">💬</div>
                        <p class="text-sm font-semibold text-gray-600">Tidak ada percakapan</p>
                        <p class="text-xs text-gray-400 mt-0.5">Cobalah mengubah filter atau kata kunci pencarian.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            displayList.forEach(conv => {
                const name = conv.first_name || 'Customer';
                const initials = getInitials(name);
                const isAgentLast = conv.agent_name !== null;
                const messagePrefix = isAgentLast ? `<span class="text-emerald-600 font-semibold">Anda: </span>` : '';
                const tag = customerTags[conv.chat_id];

                html += `
                    <div onclick="openChat('${conv.chat_id}')" 
                         class="bg-white rounded-xl p-3.5 shadow-sm hover:shadow-md border border-gray-100 flex items-center space-x-3.5 cursor-pointer active:scale-[0.99] transition-all relative">
                        
                        <!-- Avatar -->
                        <div class="w-12 h-12 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-base flex-none shadow-sm relative">
                            ${initials}
                            ${!isAgentLast ? `<span class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-yellow-400 border-2 border-white rounded-full"></span>` : ''}
                        </div>

                        <!-- Info -->
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <div class="flex items-center space-x-1.5 truncate pr-2">
                                    <h3 class="text-sm font-bold text-gray-900 truncate">${escapeHtml(name)}</h3>
                                    ${tag ? `<span class="bg-yellow-100 text-yellow-800 text-[9px] font-bold px-1.5 py-0.2 rounded">${tag}</span>` : ''}
                                </div>
                                <span class="text-[10px] text-gray-400 flex-none font-medium">${formatTime(conv.latest_time)}</span>
                            </div>
                            
                            <p class="text-xs text-gray-500 truncate leading-relaxed">
                                ${messagePrefix}${escapeHtml(conv.latest_message)}
                            </p>

                            <span class="text-[10px] text-gray-400 block mt-0.5 tracking-tight font-mono">${conv.chat_id}</span>
                        </div>
                    </div>
                `;
            });

            inboxContainer.innerHTML = html;
        }

        function filterConversations() {
            filteredSearchQuery = document.getElementById('search-input').value;
            renderInbox();
        }

        function showLoadingInbox() {
            inboxContainer.innerHTML = `
                <div class="space-y-2.5 p-1">
                    ${[1, 2, 3, 4, 5].map(() => `
                        <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100 flex items-center space-x-3 animate-pulse">
                            <div class="w-12 h-12 rounded-full bg-gray-200 flex-none"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-3.5 bg-gray-200 rounded w-1/3"></div>
                                <div class="h-3 bg-gray-100 rounded w-3/4"></div>
                                <div class="h-2.5 bg-gray-100 rounded w-1/4"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showErrorInbox(message) {
            inboxContainer.innerHTML = `
                <div class="p-6 text-center">
                    <div class="bg-red-50 text-red-600 p-4 rounded-xl text-xs space-y-3 border border-red-200">
                        <p class="font-bold">Terjadi Kesalahan</p>
                        <p>${message}</p>
                        <button onclick="loadInbox(true)" class="px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-semibold shadow hover:bg-red-700 transition">
                            Coba Lagi
                        </button>
                    </div>
                </div>
            `;
        }

        function showRefreshSpinner(show) {
            const icon = document.getElementById('refresh-icon');
            if (!icon) return;
            if (show) {
                icon.classList.add('animate-spin');
            } else {
                icon.classList.remove('animate-spin');
            }
        }


        async function openChat(chat_id) {
            currentChat = chat_id;

            // Find metadata from conversation array
            const conv = conversations.find(c => c.chat_id === chat_id);
            const customerName = conv ? conv.first_name : 'Customer';

            // Set Chat Header Title & Phone
            document.getElementById('chat-header-name').innerText = customerName;
            document.getElementById('chat-header-phone').innerText = chat_id;
            document.getElementById('chat-header-avatar').innerText = getInitials(customerName);

            // Update Tag display on header
            const tagBadge = document.getElementById('chat-header-tag');
            const currentTag = customerTags[chat_id];
            if (currentTag) {
                tagBadge.innerText = currentTag;
                tagBadge.classList.remove('hidden');
            } else {
                tagBadge.classList.add('hidden');
            }

            // Switch Screen View
            screenInbox.classList.add('hidden');
            screenChat.classList.remove('hidden');

            // Reset Composer
            messageInput.value = '';
            toggleSendButton();

            // Load Chat messages
            await loadMessages(chat_id);
        }

        function closeChat() {
            currentChat = null;
            screenChat.classList.add('hidden');
            screenInbox.classList.remove('hidden');
            loadInbox();
        }

        async function loadMessages(chat_id, isManual = false) {
            if (!chat_id) return;

            if (messages.length === 0 || isManual) {
                showLoadingMessages();
            }

            try {
                const response = await fetch(`${READ_API}?chat_id=${chat_id}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    // Sort messages chronologically (oldest first)
                    messages = data.sort((a, b) => new Date(a.time).getTime() - new Date(b.time).getTime());
                } else {
                    messages = [];
                }

                renderChat();
                scrollToBottom();

            } catch (error) {
                console.error("Error loading chat messages:", error);
                showToast("Gagal memuat pesan", true);
            }
        }


        function renderChat() {
            if (!messages || messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center text-gray-400 my-auto">
                        <span class="text-3xl mb-2">📥</span>
                        <p class="text-xs font-medium">Belum ada percakapan dengan customer ini.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            messages.forEach((msg) => {
                // Rule: agent_name === null -> CUSTOMER, agent_name !== null -> AGENT
                const isCustomer = msg.agent_name === null || msg.agent_name === undefined;

                if (isCustomer) {
                    /* CUSTOMER BUBBLE: Align Left, bg-gray-200, text-black */
                    html += `
                        <div class="flex flex-col items-start mb-2 group">
                            <div class="max-w-[82%] bg-gray-200 text-black rounded-2xl rounded-tl-xs px-3.5 py-2 shadow-xs text-xs relative leading-relaxed break-words hover:shadow-sm transition">
                                <p class="pr-5 whitespace-pre-wrap">${escapeHtml(msg.user_message)}</p>
                                <div class="flex items-center justify-between mt-1 pt-0.5 border-t border-black/5 text-[9px] text-gray-500 font-medium select-none">
                                    <button onclick="copyToClipboard('${escapeJs(msg.user_message)}')" class="hover:text-emerald-700 font-semibold">Salin</button>
                                    <span>${formatTime(msg.time)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    /* AGENT BUBBLE: Align Right, bg-green-500, text-white */
                    html += `
                        <div class="flex flex-col items-end mb-2">
                            <div class="max-w-[82%] bg-green-500 text-white rounded-2xl rounded-tr-xs px-3.5 py-2 shadow-xs text-xs relative leading-relaxed break-words">
                                <span class="text-[9px] text-emerald-100 font-semibold block mb-0.5">${escapeHtml(msg.agent_name || 'Agent')}</span>
                                <p class="pr-5 whitespace-pre-wrap">${escapeHtml(msg.user_message)}</p>
                                <div class="flex items-center justify-between mt-1 pt-0.5 border-t border-white/10 text-[9px] text-emerald-100 font-medium select-none">
                                    <button onclick="copyToClipboard('${escapeJs(msg.user_message)}')" class="hover:underline opacity-80">Salin</button>
                                    <span class="flex items-center">
                                        ${formatTime(msg.time)}
                                        <svg class="w-3 h-3 ml-1 text-emerald-100 inline" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            chatContainer.innerHTML = html;
        }

        function showLoadingMessages() {
            chatContainer.innerHTML = `
                <div class="flex items-center justify-center h-full">
                    <div class="bg-white/90 px-4 py-2.5 rounded-full shadow-md flex items-center space-x-2 text-xs text-gray-700">
                        <svg class="animate-spin h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Memuat percakapan...</span>
                    </div>
                </div>
            `;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }


        function toggleSendButton() {
            const hasText = messageInput.value.trim().length > 0;
            sendBtn.disabled = !hasText;
        }

        function insertQuickReply(text) {
            messageInput.value = text;
            toggleSendButton();
            messageInput.focus();
        }

        async function handleSendSubmit(event) {
            event.preventDefault();

            const text = messageInput.value.trim();
            if (!text || !currentChat) return;

            // Lock controls while sending
            messageInput.disabled = true;
            sendBtn.disabled = true;

            const sendPayload = {
                chat_id: currentChat,
                user_message: text
            };

            try {
                const response = await fetch(SEND_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(sendPayload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.success || response.status === 200) {
                    // Play send chime sound
                    playNotificationSound();

                    // Optimistically append new message to UI
                    const newMsg = {
                        wa_message_id: 'temp_' + Date.now(),
                        agent_name: 'Agent CS',
                        chat_id: currentChat,
                        user_message: text,
                        time: new Date().toISOString()
                    };

                    messages.push(newMsg);
                    renderChat();
                    scrollToBottom();

                    // Reset composer
                    messageInput.value = '';
                    showToast("Pesan terkirim ke customer!");

                    // Background sync inbox list
                    loadInbox();
                } else {
                    throw new Error(result.message || "Gagal mengirim pesan");
                }

            } catch (error) {
                console.error("Error sending message:", error);
                showToast("Gagal mengirim pesan", true);
            } finally {
                messageInput.disabled = false;
                toggleSendButton();
                messageInput.focus();
            }
        }


        function openCustomerNoteModal() {
            if (!currentChat) return;
            const currentTag = customerTags[currentChat] || '';
            document.getElementById('modal-tag-select').value = currentTag;
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeCustomerNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
        }

        function saveCustomerTag() {
            if (!currentChat) return;
            const selectedTag = document.getElementById('modal-tag-select').value;
            if (selectedTag) {
                customerTags[currentChat] = selectedTag;
            } else {
                delete customerTags[currentChat];
            }
            localStorage.setItem('wa_cs_tags', JSON.stringify(customerTags));
            
            // Update Header Tag
            const tagBadge = document.getElementById('chat-header-tag');
            if (selectedTag) {
                tagBadge.innerText = selectedTag;
                tagBadge.classList.remove('hidden');
            } else {
                tagBadge.classList.add('hidden');
            }

            closeCustomerNoteModal();
            showToast("Tag customer diperbarui!");
            renderInbox();
        }

        function copyCustomerPhone() {
            if (!currentChat) return;
            copyToClipboard(currentChat);
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("Berhasil disalin!");
            } catch (err) {
                showToast("Gagal menyalin text", true);
            }
            document.body.removeChild(textarea);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJs(str) {
            if (!str) return '';
            return String(str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, ' ');
        }


        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                if (currentChat) {
                    loadMessages(currentChat);
                } else {
                    loadInbox();
                }
            }, 15000);
        }

        // Initialize App on DOM Content Loaded
        window.addEventListener('DOMContentLoaded', () => {
            loadInbox();
            startAutoRefresh();
        });
    </script>
</body>
</html>
